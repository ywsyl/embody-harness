# @embody/dsh-rolebus —— 里程碑 0 的 bundle 补丁。
#
# 分层语义（与引擎一致）：每个 bundle 的 cordis.patch.yml 是一层；profile 自身的
# cordis.patch.yml 在其后；按行(id)整块替换 config，后面的层胜出。因此本层只负责
# “插入 rolebus 行 + 给一份可被 profile 覆盖的中性默认值”，角色差异放在各自的
# profile 覆盖层里（见 roles/<role>.patch.yml）。

- insert:
    - id: rolebus
      name: '@embody/dsh-rolebus'
      config:
        # 占位默认值：真实“角色身份/对端”由每个角色 profile 的覆盖层改写。
        # 里程碑 0 只验证这些值能随分层正确落到各 profile，不经总线传输。
        role: unset
        peers: []
        transport: file
