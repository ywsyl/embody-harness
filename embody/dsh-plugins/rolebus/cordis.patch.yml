# @embody/dsh-rolebus —— rolebus bundle 补丁。
#
# 分层语义（与引擎一致）：每个 bundle 的 cordis.patch.yml 是一层；profile 自身的
# cordis.patch.yml 在其后；按行(id)整块替换 config，后面的层胜出。因此本层只负责
# “插入 rolebus 行 + 给一份可被 profile 覆盖的中性默认值”，角色差异放在各自的
# profile 覆盖层里（每个已建置角色一份：interactor 见 Interactor/cordis.patch.yml、
# orchestrator 见 Orchestrator/cordis.patch.yml、planner 见 Planner/cordis.patch.yml）。
#
# 里程碑 1（真总线）：config 不再只有里程碑 0 的分层占位 —— 插件 apply 会用
# role/peers 校验发件身份与路由、把事件经 transportConfig.root（缺省 = $DSH_HOME/
# rolebus）下的文件 spool 投递到目标角色收件箱，并按 role 注册 src/event-catalog.ts
# 里本角色发出的具名工具 rolebus_send_<event_type>。下面只放中性默认：role=unset
# 且 peers=[] 表示“尚未被 profile 赋予身份”，此时插件只收不发、不注册任何发件工具。

- insert:
    - id: rolebus
      name: '@embody/dsh-rolebus'
      config:
        role: unset
        peers: []
        transport: file
