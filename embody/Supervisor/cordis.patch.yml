# Supervisor（监督器）角色 profile 覆盖层 —— 本角色的唯一事实源。
#
# 安装脚本把它写入 $DSH_HOME/profiles/supervisor/cordis.patch.yml。语义（与引擎一致）：
# 这是 profile 层，位于 bundle 层（@deepseek-ai/dsh-base、@embody/dsh-rolebus、
# @embody/dsh-supervisor-loop）之后，对已插入的行按 id 整块替换 config，后面的层胜出。
# 因此人设字段（system-prompt 只认 personaPrefix / personaSuffix，没有 persona）与
# rolebus 身份都必须整块重写，不是逐键合并。
#
# 本角色与其余三个角色最大的不同是**唤醒源**：interactor / orchestrator / planner 由
# rolebus 事件唤醒（常驻叠加层把 rolebus.resident 打开），监督器不接任何入站事件——
# 事件目录里没有一条 target 是 supervisor 的条目。它的唤醒源是定时观察循环
# （@embody/dsh-supervisor-loop），那行由本 profile 之上的常驻叠加层
# Supervisor/resident.patch.yml 打开（bundle 里插的是 disabled: true）。
#
# 角色职责边界见 Supervisor/execution_supervisor_implementation.md 与 reference/events.md。

# 人设文本不内联在 YAML 里，从 Supervisor/prompts/supervisor.md 读（与其余三个角色同一做法）：
#   - `!!js` 是 Loader 的配置表达式（见 docs/cordis-primer），在装载本行时求值一次；
#     `getBuiltinModule` 是在 ESM 函数体里同步拿到 node 内建模块的方式（无 require）。
#   - 路径相对引擎根（= 启动 dsh 时的工作目录）；所以必须从引擎根启动，比如
#     scripts/role-daemon.sh。
#   - 文件缺失即 ENOENT 启动失败（fail loud），不会静默退化成空人设。
- id: system-prompt
  config:
    # 关掉引擎硬编码的 harness:identity 首句（否则它会拼在人设前面）。
    includeHarnessIdentity: false
    personaPrefix: !!js process.getBuiltinModule('node:fs').readFileSync('embody/Supervisor/prompts/supervisor.md', 'utf8').trim()

# 本角色**只发不收**：事件目录里没有一条 target 为 supervisor 的条目，所以它不接任何入站
# 事件，也不叠 rolebus.resident（那一行是给「靠事件唤醒」的角色用的，见 resident.ts）。
# peers 必须写全 interactor / orchestrator / planner 三个：
# 目录里 source 为 supervisor 的四条事件，target 分别是 interactor（observe_event）、
# orchestrator（robot_status_update）与 planner（planner_ 前缀两条），而 rolebus 装配时
# 要求每条事件的 target 都在 peers 内，漏一个直接 boot 失败。两个版本（旧版
# interactor+orchestrator / 合并版 planner）不同时启动，投哪一版由人设交代。
- id: rolebus
  config:
    role: supervisor
    peers:
      - interactor
      - orchestrator
      - planner
    transport: file

# 自定义工具（configs/agent_plugin.py 里的白名单）本角色没有：监督器手里只有 rolebus
# 按目录生成的 rolebus_send_*。@embody/dsh-tools-bridge 与其他角色一样装在本 profile 的
# bundle 列表里（安装脚本对所有角色一视同仁），但本 profile **不给它角色身份**——role 保持
# bundle 层的中性默认 unset，apply 当场返回：不注册任何工具，也不起 Python 桥。所以这里
# 没有覆盖行，configs/agent_plugin.py 的 ROLE_TOOLS 里也没有 supervisor 键。

# 工作区指令（AGENTS.md / CLAUDE.md 等）不拼进上下文：角色人设的唯一来源是本角色
# profile 里的人设文件，不让仓库里随手放的 AGENTS.md 混进来（见 agent-instructions 的
# instructionFileCandidates / projectRootMarkers 走查逻辑）。
- id: agent-instructions
  disabled: true

# 原生工具：显式禁用本角色不该用（或根本用不了）的工具。监督器不向用户提问（它与用户的
# 通道不存在，用户只听交互器说话）、不委托子代理、不起工作流。
- id: user-questions
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-todo
  disabled: true

# 上下文预算：本角色是唯一一个「跑不完的回合」——每 intervalMs 加一轮，加到自己进程退出。
# dsh-base 已经挂了 dsh-compaction-basic，但一行配置都没给，默认是窗口的 80% 才压缩
# （路由声明 1,000,000 → 80 万 token 才第一次压，之前每轮请求都扛着整段历史）。
# 这里把它压到「保留最近约 20 轮原文、总上下文到 50k token 就压」（数值见
# configs/configs.py 的 Supervisor 一节，经进程环境过桥，与 intervalMs 同一套）。
# 两个值不能随便改：retainTokens 必须小于阈值（装载时校验），阈值只有「占窗口的比例」写法。
- id: compaction-basic
  config:
    thresholdRatio: !!js Number(process.env.SUPERVISOR_COMPACT_THRESHOLD_RATIO)
    retainTokens: !!js Number(process.env.SUPERVISOR_COMPACT_RETAIN_TOKENS)
