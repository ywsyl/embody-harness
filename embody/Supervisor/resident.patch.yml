# Supervisor 常驻待机叠加层 —— 只在「常驻启动」时经 --patch 叠加，不进 profile 层。
#
# 为什么单独一份文件而不是直接写进 Supervisor/cordis.patch.yml：常驻是**启动形态**，不是
# 角色身份（与 Orchestrator/resident.patch.yml 同一理由，只是本角色的唤醒源不同）。写进
# profile 层的话，任何一次性 headless 试跑也会顺带起一个定时器，每隔 n 秒往那一轮里插一条
# 与试跑无关的观察输入。
#
# 本角色的唤醒源是**定时观察循环**，不是 rolebus 事件：@embody/dsh-supervisor-loop 的
# bundle 补丁插的是 `disabled: true` 的中性行，打开它的唯一地方就是这里（`disabled: false`
# + 真实 config）。这一对必须一致。
#
# rolebus 行照旧整块重写：叠加层是「按 id 整块替换 config」，role / peers / transport 必须与
# Supervisor/cordis.patch.yml 里的一致，本文件不打开 resident（监督器不收入站事件）。
# 这份重复必须与 Supervisor/cordis.patch.yml 逐字一致：叠加后的 role/peers 仍须是本角色的。
- id: rolebus
  config:
    role: supervisor
    peers:
      - interactor
      - orchestrator
      - planner
    transport: file

# 定时观察：每隔 intervalMs 读一遍下面两个源，拼成一轮交给本角色 agent 判断。
#   - intervalMs 的秒数唯一事实源是 configs/configs.py 的 SUPERVISOR_INTERVAL；cordis 的配置
#     层读不到 Python，启动脚本（scripts/role-daemon.sh）把它换算成毫秒放进进程环境，这里只
#     取那个值。`!!js` 是 Loader 的配置表达式（见 docs/cordis-primer），装载本行时求值一次；
#     变量缺失时得到 NaN，插件在装载时就会以「intervalMs 必须是正整数毫秒」报错，不会退化成
#     某个内置节拍。
#   - sessionId 是本角色会话的**基础 id**（重启续接的是它这一份）；同一个 DSH_HOME 下同时
#     只能有一个常驻进程持有它，第二个会因会话写租约失败而收不到任何一轮。运行期日志到
#     maxSessionBytes 会轮转成 `<基础 id>.<时间戳>` 的新会话（同一 id 建不回来，见插件头部）。
#   - maxSessionBytes 的 MB 数唯一事实源是 configs/configs.py 的 SUPERVISOR_SESSION_MAX_MB，
#     与 intervalMs 同一条过桥路径。量的是**磁盘上那份日志的压缩后物理字节数**（引擎的
#     `stat().sizeBytes`，不是 token 也不是解压后大小）；到量就换一份新会话。
#   - path 相对启动工作目录（= 引擎根，与人设 !!js 同一约定），所以要从引擎根启动。
- id: supervisor-loop
  disabled: false
  config:
    intervalMs: !!js Number(process.env.SUPERVISOR_INTERVAL_MS)
    sessionId: supervisor-loop
    maxSessionBytes: !!js Number(process.env.SUPERVISOR_SESSION_MAX_BYTES)
    sources:
      - name: 视觉观察
        path: embody/runtime_files/vision_obs.yaml
      - name: 本体状态
        path: embody/runtime_files/robot_status.yaml
