# 工具清单（YAML 格式）
# OpenAI tools 格式的所有属性统一写在 openai_schema 下
# 自定义执行属性写在 openai_schema 同级
# 转换逻辑需将 openai_schema 提取出来作为 OpenAI tools 格式使用

tools:
- type: function
  function:
    name: speak
    description: 使用TTS服务通过扬声器进行1次语音播报（非持续），支持文本转语音并播放。
    parameters:
      type: object
      properties:
        text:
          type: string
          description: 要播报的文本内容
        play_now:
          type: boolean
          description: 是否立即播放并打断当前正在播报的内容。默认 false，表示不主动抢麦；true表示主动抢麦、立刻打断在播的内容。
        need_listen:
          type: boolean
          description: 播报完成后是否需要收听用户回复。默认false，表示本次仅播报、不需要收听（如通知、告知）；true表示本次播报需要与用户交互并获得回复（如询问、聊天等）。
      required:
        - text
      additionalProperties: false
  extra:
    repeatable: false
    output_format: "成功输出 `✅ 播报完成`，失败则输出 JSON 格式错误信息"

