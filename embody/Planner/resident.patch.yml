# Planner 常驻待机叠加层 —— 只在「常驻启动」时经 --patch 叠加，不进 profile 层。
#
# 为什么单独一份文件而不是直接写进 Planner/cordis.patch.yml：常驻是**启动形态**，不是
# 角色身份（与 Interactor / Orchestrator 两份同一理由）。写进 profile 层的话，任何一次性
# 试跑也会顺带建出一个永不唤醒的 agent。这条差异由 scripts/role-daemon.sh 用 --patch 显式表达。
#
# 叠加层同样是「按 id 整块替换 config」，所以 rolebus 行要整块重写：role / peers /
# transport 必须与 Planner/cordis.patch.yml 里的一致，本文件只多 resident: true。
# 这份重复必须与 Planner/cordis.patch.yml 逐字一致：叠加后的 role/peers 仍须是本角色的。
#
# planner 只在收件侧工作：它没有发件工具，唤醒它的只能是第三方事件（supervisor / cloud）。
- id: rolebus
  config:
    role: planner
    peers:
      - supervisor
    transport: file
    resident: true
    # 思考模式：值来自 configs/agents.py 的 ROLE_THINKING（经 role-daemon.sh 过桥成进程环境）。
    # 非空 = 本角色改走那条声明了推理档位的镜像路由，而"不选档位"在线上就是 thinking 的关闭值
    # （见 configs/settings-model.yaml 的 robot-gateway-nothink）；空串 = 不改路由，照走
    # agent-default-model 的 robot-gateway，请求体一字不改、思考开着。
    # `?? ''` 防的是手工 `pnpm dsh --profile … --patch …` 绕过 role-daemon 时取不到这个变量
    # （同 ORCHESTRATOR_TASK_LIST_PATH 那条已接受的性质）：那种跑法下思考回到默认，不影响常驻启动。
    modelProvider: !!js (process.env.ROLE_MODEL_PROVIDER ?? '')
